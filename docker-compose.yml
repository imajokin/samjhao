# Start with:  docker compose up
# Then open:   http://localhost:8000
#
# No keys are needed to start. Every setting below has an empty or safe
# default, so a fresh download with no .env file still reaches the home screen.
# If a .env file exists next to this file, Docker Compose reads it by itself.
services:
  samjhao:
    build: .
    ports:
      - "8000:8000"
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_THINKING: ${LLM_THINKING:-}
      SARVAM_API_KEY: ${SARVAM_API_KEY:-}
      SARVAM_STT_MODEL: ${SARVAM_STT_MODEL:-}
      SARVAM_STT_MODE: ${SARVAM_STT_MODE:-}
      SARVAM_TTS_VOICE: ${SARVAM_TTS_VOICE:-}
      LIVE_DEMO_URL: ${LIVE_DEMO_URL:-}
      VIDEO_URL: ${VIDEO_URL:-}
      SESSION_TTL_MINUTES: ${SESSION_TTL_MINUTES:-30}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-30}
      DAILY_REQUEST_CAP: ${DAILY_REQUEST_CAP:-2000}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
